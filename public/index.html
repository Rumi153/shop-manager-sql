<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Manager</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2430; --muted:#657083; --line:#e1e5ec; --accent:#1f5eff; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151c; --card:#18202b; --ink:#e8edf4; --muted:#93a0b4; --line:#263143; --accent:#6b9bff; --bad:#ff7b6b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { background:var(--card); border-bottom:1px solid var(--line); }
  .wrap { max-width:960px; margin:0 auto; padding:0 20px; }
  header .wrap { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; padding-top:16px; }
  h1 { margin:0; font-size:1.3rem; }
  nav { display:flex; gap:4px; }
  nav button { border:0; background:none; color:var(--muted); padding:12px 14px; font:inherit; cursor:pointer; border-bottom:3px solid transparent; }
  nav button[aria-selected=true] { color:var(--ink); border-color:var(--accent); font-weight:600; }
  main { padding:24px 0 60px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:20px; }
  .stat, .panel { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  .stat b { display:block; font-size:1.5rem; }
  .stat span { color:var(--muted); }
  .panel { margin-bottom:16px; overflow-x:auto; }
  h2 { margin:0 0 12px; font-size:1.05rem; }
  form.row { display:flex; gap:8px; flex-wrap:wrap; }
  input, select { padding:9px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:inherit; font:inherit; min-width:0; }
  input.name { flex:2 1 160px; } input.num { flex:1 1 90px; } select { flex:2 1 160px; }
  button.btn { padding:9px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button.link { border:0; background:none; color:var(--accent); cursor:pointer; font:inherit; padding:2px 6px; }
  button.link.del { color:var(--bad); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:.85rem; }
  td input { width:100%; }
  .low { color:var(--bad); font-weight:600; }
  .empty { color:var(--muted); padding:8px 0; }
  #msg { min-height:22px; margin-bottom:10px; color:var(--bad); }
  #msg.ok { color:var(--muted); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Shop Manager</h1>
    <nav id="tabs" role="tablist">
      <button role="tab" data-t="products" aria-selected="true">Products</button>
      <button role="tab" data-t="sales" aria-selected="false">Sales</button>
      <button role="tab" data-t="history" aria-selected="false">History</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="stats" id="stats"></div>
  <p id="msg" role="status"></p>
  <div id="view"></div>
</main>
<script>
let db = { products: [], sales: [], history: [] }, tab = "products", editing = null;
const $ = (s) => document.querySelector(s);
const money = (n) => "Rs " + Number(n).toLocaleString();

function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => k.startsWith("on") ? (e[k] = v) : k === "class" ? (e.className = v) : e.setAttribute(k, v));
  kids.flat().forEach((k) => e.append(k instanceof Node ? k : document.createTextNode(k)));
  return e;
}
function say(text, ok) { const m = $("#msg"); m.textContent = text; m.className = ok ? "ok" : ""; }

async function load() {
  try { db = await (await fetch("/api/db")).json(); render(); }
  catch (e) { say("Could not load data: " + e.message); }
}
async function act(body, okText) {
  try {
    const r = await fetch("/api/db", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Request failed");
    db = d; editing = null; say(okText || "Saved.", true); render(); return true;
  } catch (e) { say(e.message); return false; }
}

function table(heads, rows, empty) {
  if (!rows.length) return el("p", { class: "empty" }, empty);
  return el("table", {}, el("thead", {}, el("tr", {}, heads.map((h) => el("th", {}, h)))), el("tbody", {}, rows));
}

function productsView() {
  const f = el("form", { class: "row", onsubmit: async (e) => {
    e.preventDefault();
    const g = (n) => f.elements[n].value;
    if (await act({ action: "addProduct", name: g("name"), price: g("price"), stock: g("stock") }, "Product added.")) f.reset();
  } },
    el("input", { class: "name", name: "name", placeholder: "Product name", "aria-label": "Product name", required: "" }),
    el("input", { class: "num", name: "price", type: "number", min: "0", step: "any", placeholder: "Price", "aria-label": "Price", required: "" }),
    el("input", { class: "num", name: "stock", type: "number", min: "0", step: "1", placeholder: "Stock", "aria-label": "Stock", required: "" }),
    el("button", { class: "btn", type: "submit" }, "Add product"));

  const rows = db.products.map((p) => {
    if (editing === p.id) {
      const n = el("input", { value: p.name }), pr = el("input", { type: "number", min: "0", step: "any", value: p.price }), st = el("input", { type: "number", min: "0", step: "1", value: p.stock });
      return el("tr", {}, el("td", {}, n), el("td", {}, pr), el("td", {}, st), el("td", {},
        el("button", { class: "link", onclick: () => act({ action: "updateProduct", id: p.id, name: n.value, price: pr.value, stock: st.value }, "Product updated.") }, "Save"),
        el("button", { class: "link", onclick: () => { editing = null; render(); } }, "Cancel")));
    }
    return el("tr", {}, el("td", {}, p.name), el("td", {}, money(p.price)), el("td", { class: p.stock <= 5 ? "low" : "" }, String(p.stock) + (p.stock <= 5 ? " (low)" : "")), el("td", {},
      el("button", { class: "link", onclick: () => { editing = p.id; render(); } }, "Edit"),
      el("button", { class: "link del", onclick: () => confirm(`Delete ${p.name}?`) && act({ action: "deleteProduct", id: p.id }, "Product deleted.") }, "Delete")));
  });
  return [el("div", { class: "panel" }, el("h2", {}, "Add a product"), f),
          el("div", { class: "panel" }, el("h2", {}, "Inventory"), table(["Product", "Price", "In stock", ""], rows, "No products yet. Add your first product above."))];
}

function salesView() {
  const sel = el("select", { name: "p", "aria-label": "Product", required: "" }, el("option", { value: "" }, "Choose product"),
    db.products.map((p) => el("option", { value: p.id }, `${p.name} (${p.stock} in stock)`)));
  const f = el("form", { class: "row", onsubmit: async (e) => {
    e.preventDefault();
    if (await act({ action: "sell", productId: Number(sel.value), qty: f.elements.q.value, customer: f.elements.c.value }, "Sale recorded. Stock updated.")) f.reset();
  } }, sel,
    el("input", { class: "num", name: "q", type: "number", min: "1", step: "1", placeholder: "Qty", "aria-label": "Quantity", required: "" }),
    el("input", { class: "name", name: "c", placeholder: "Customer (optional)", "aria-label": "Customer" }),
    el("button", { class: "btn", type: "submit" }, "Record sale"));
  const rows = db.sales.map((s) => el("tr", {}, el("td", {}, new Date(s.time).toLocaleString()), el("td", {}, s.customer), el("td", {}, s.product), el("td", {}, String(s.qty)), el("td", {}, money(s.total))));
  return [el("div", { class: "panel" }, el("h2", {}, "New sale"), f),
          el("div", { class: "panel" }, el("h2", {}, "Sales"), table(["Time", "Customer", "Product", "Qty", "Total"], rows, "No sales yet. Record one above."))];
}

function historyView() {
  const rows = db.history.map((h) => el("tr", {}, el("td", {}, new Date(h.time).toLocaleString()), el("td", {}, h.action), el("td", {}, h.detail)));
  return el("div", { class: "panel" }, el("h2", {}, "Database history"), table(["Time", "Change", "Details"], rows, "No changes yet."));
}

function render() {
  const revenue = db.sales.reduce((a, s) => a + s.total, 0);
  const stats = [[db.products.length, "Products"], [db.products.reduce((a, p) => a + p.stock, 0), "Items in stock"], [db.sales.length, "Sales made"], [money(revenue), "Revenue"]];
  $("#stats").replaceChildren(...stats.map(([v, l]) => el("div", { class: "stat" }, el("b", {}, String(v)), el("span", {}, l))));
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.t === tab));
  const v = tab === "products" ? productsView() : tab === "sales" ? salesView() : historyView();
  $("#view").replaceChildren(...[v].flat());
}
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => { tab = b.dataset.t; editing = null; say(""); render(); }));
load();
</script>
</body>
</html>
